name: Publish Voice of Terra

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'web/pages/*'
      - 'web/pages/public/sample/**'
      - 'web/app/globals.css'
      - 'web/lib/story.mjs'
      - 'web/lib/audio.mjs'
      - 'web/backend/media-index/**'
      - 'web/vite.pages.config.ts'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/scripts/verify-pages.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node scripts/verify-pages.mjs
        working-directory: web
      - run: npm run build:pages
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
